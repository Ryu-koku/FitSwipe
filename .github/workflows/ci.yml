name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Check mobile app
        working-directory: mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK=1 pnpm doctor
          pnpm exec expo install --check || echo '::warning::Expo の依存がSDK推奨バージョンより古い（npx expo install --check で更新）'
      - name: Check Cloudflare Worker without Wrangler
        run: |
          node --check rooms-server/cloudflare/worker.mjs
          node --test rooms-server/cloudflare/test/google-auth.test.mjs rooms-server/cloudflare/test/room-comparison.test.mjs rooms-server/cloudflare/test/session-cleanup.test.mjs rooms-server/cloudflare/test/safety.test.mjs rooms-server/cloudflare/test/review-login.test.mjs

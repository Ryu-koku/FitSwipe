name: Publish Play internal test

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ROOMS_URL: https://fitswipe-rooms-api.prompt-tem.workers.dev
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Expo dependencies
        run: pnpm --dir mobile install --frozen-lockfile
      - name: Check Expo app
        run: |
          pnpm --dir mobile typecheck
          pnpm --dir mobile lint
          pnpm --dir mobile test
          pnpm --dir mobile doctor
      - name: Prepare upload signing and version
        env:
          KEYSTORE_BASE64: ${{ secrets.FITLOG_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.FITLOG_UPLOAD_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$UPLOAD_PASSWORD" && test -n "$PLAY_JSON"
          test -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "FITLOG_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo 'FITLOG_UPLOAD_KEY_ALIAS=upload' >> "$GITHUB_ENV"
          echo "FITLOG_VERSION_CODE=$(( $(date +%s) - 1577836800 ))" >> "$GITHUB_ENV"
      - name: Generate Expo Android project
        run: pnpm --dir mobile exec expo prebuild --platform android --no-install --clean
      - name: Build signed Expo bundle
        env:
          FITLOG_UPLOAD_PASSWORD: ${{ secrets.FITLOG_UPLOAD_PASSWORD }}
        run: ./mobile/android/gradlew -p mobile/android :app:bundleRelease
      - name: Verify release rooms configuration
        run: |
          grep -R -F "$EXPO_PUBLIC_ROOMS_URL" mobile/android/app/build/generated/assets
      - name: Publish to internal testing only
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.local.fitlogsolo
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: internal-${{ env.FITLOG_VERSION_CODE }}
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
